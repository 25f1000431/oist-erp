services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oist_erp
      POSTGRES_USER: oist
      POSTGRES_PASSWORD: oist
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oist -d oist_erp"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
