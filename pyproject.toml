[project]
name = "oist-mock-erp"
version = "0.1.0"
description = "Mock college ERP API for OIST CSE"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.5,<3",
  "PyJWT>=2.9,<3",
  "pwdlib[argon2]>=0.2,<1",
  "email-validator>=2.2,<3",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1", "ruff>=0.6,<1"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
